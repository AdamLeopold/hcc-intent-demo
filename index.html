<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="hcc-token" content="static"><title>HCC-INTENT · 患者治疗地图</title>
<meta name="description" content="患者治疗地图：按住院和操作展开完整病程，连接每一次治疗与下一步。">
<link rel="alternate" hreflang="en" href="en/">
<link rel="stylesheet" href="flow.css"><link rel="stylesheet" href="site.css">
<script src="mock.js"></script><script src="flow.js" defer></script></head>
<body>
<aside id="patientPanel" class="patient-panel">
  <a class="brand" href="workbench.html"><span class="brand-icon">H</span><span>HCC-INTENT<small>BIOAGENT / CLINICAL INTELLIGENCE</small></span></a>
  <div class="workspace-tag"><i></i> 患者治疗地图 <span>LIVE</span></div>
  <div class="list-heading">患者档案 <span id="totalPatients">—</span></div>
  <label class="search"><span>⌕</span><input id="patientSearch" aria-label="搜索姓名或身份证后四位" placeholder="姓名 / 身份证后四位"></label>
  <div id="patientList" class="patient-list"></div><button id="loadMore" class="load-more">加载更多患者</button>
  <div class="sidebar-foot"><i></i><div>GPT-6 Astra<small>本机档案 · 持续分析</small></div><span>✧</span></div>
</aside>
<main id="mainPanel">
  <header class="topbar"><div class="patient-title"><button id="togglePatients" aria-label="收起或展开患者列表">☰</button><div><div class="eyebrow">PATIENT JOURNEY</div><h1 id="patientName">患者治疗地图</h1></div></div><div class="header-tools"><a class="site-link" href="workbench.html" title="重复 TACE 节点工作台">新版工作台 ↗</a><nav class="lang-switch" aria-label="Language"><span aria-current="page">中文</span><a href="en/" hreflang="en" lang="en">English</a></nav><button id="showVersions">版本记录</button><button id="fullscreen" aria-label="全屏画布">⛶</button><button id="toggleInspector" aria-label="收起或展开分析面板">◧</button></div></header>
  <div class="journey-meta"><span id="patientRange">读取患者档案…</span><span id="nodeCount"></span><span class="legend"><i></i> 已记录 <i class="purple"></i> 后续分支</span></div>
  <section id="canvas" class="canvas" aria-label="可拖拽患者治疗流程图" tabindex="0">
    <div class="canvas-grid"></div><div id="world" class="world"><svg id="episodeBraces" class="edges" aria-label="住院阶段汇总括号"></svg><div id="episodeSummaries"></div><svg id="edges" class="edges" aria-label="治疗连线"></svg><div id="edgeLabels"></div><div id="nodes"></div></div>
    <div id="canvasEmpty" class="canvas-empty"><div class="orbit">✧</div><h2>连接每一次治疗与下一步</h2><p>选择患者，展开完整治疗地图</p></div>
    <div class="canvas-top"><button id="journeyIndex">病程目录</button><button id="addNode" class="accent">＋ 添加状态</button><button id="addLink">↗ 绘制连线</button><button id="undoEdit" title="撤销最近一次临床编辑">撤销</button></div>
    <div class="canvas-bottom"><div class="canvas-controls"><button id="zoomOut" aria-label="缩小">−</button><span id="zoomValue">100%</span><button id="zoomIn" aria-label="放大">＋</button><span class="divider"></span><button id="fitGraph">适应全图</button><button id="goCurrent">定位当前</button><button id="resetLayout" title="恢复自动布局">↺</button></div><span class="gesture-hint">拖动节点调整布局 · 拖动画布平移 · 滚轮缩放</span></div>
    <div class="minimap-wrap"><div>病程导航 <span id="saveState">布局已保存</span></div><svg id="minimap" width="200" height="90" aria-label="病程缩略导航"></svg></div>
  </section>
  <footer><span><i></i> <span id="jobStatus">就绪</span></span><span id="revisionLabel">FLOW / v0</span></footer>
</main>
<aside id="inspector" class="inspector">
  <div class="inspector-heading"><span class="astra-mark">✧</span><div><h2>Astra 临床分析</h2><small>从记录到判断，从判断到下一步</small></div><span id="busyDot" class="status-dot"></span></div>
  <div class="inspector-tabs"><button id="analysisTab" class="active">后续分析</button><button id="detailTab">节点详情</button><button id="editTab">补充记录</button></div>
  <div id="inspectorBody" class="inspector-body"><div class="empty-panel">选择一个状态框或治疗连线，查看详细内容。</div></div>
  <div class="inspector-bottom"><label><input type="checkbox" id="publicSearch" checked> 检索公共指南</label><button id="reanalyze" class="accent">重新分析 ↗</button></div>
</aside>
<dialog id="versionsDialog"><div class="dialog-title"><h2>流程版本与分析记录</h2><button id="closeVersions">×</button></div><div id="versionList"></div></dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body></html>
